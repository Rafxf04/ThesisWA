services:
  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000" # REST API
      - "9009:9009" # InfluxDB Line Protocol
      - "8812:8812" # Postgres wire protocol
      - "9003:9003" # Min health server
    volumes:
      - questdb-data:/var/lib/questdb

  renderer:
    image: grafana/grafana-image-renderer:latest
    ports:
      - 8081
    environment:
      - AUTH_TOKEN=NETTELEMETRY_SECURE_TOKEN_2026

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=questdb-questdb-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=questdb-questdb-datasource
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=NETTELEMETRY_SECURE_TOKEN_2026
      - GF_LOG_FILTERS=rendering:debug

volumes:
  questdb-data:
  grafana-data:
