apiVersion: 1

datasources:
  - name: QuestDB
    uid: QuestDB
    type: questdb-questdb-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      server: questdb
      port: 8812
      username: admin
      tlsMode: disable
    secureJsonData:
      password: quest

  - name: QuestDB-PostgreSQL
    uid: QuestDB-PostgreSQL
    type: postgres
    url: questdb:8812
    user: admin
    password: quest
    database: main
    isDefault: false
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1200
      timescaledb: false
