apiVersion: 1

datasources:
  - name: QuestDB
    type: questdb-questdb-datasource
    access: proxy
    url: http://questdb:9000
    isDefault: true
    editable: true
    jsonData:
      timeField: timestamp

  - name: QuestDB-PostgreSQL
    type: postgres
    url: questdb:8812
    user: admin
    password: quest
    database: main
    isDefault: false
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1200
      timescaledb: false
